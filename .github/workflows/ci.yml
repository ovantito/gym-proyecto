name: CI
on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instalar dependencias
        run: pip install -r backend/requirements.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Entrenar modelos (los .joblib no se versionan)
        run: python ml/entrenar.py
      - name: Pruebas (pytest)
        working-directory: backend
        run: pytest -q

  estacion:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: estacion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: estacion/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Pruebas (Vitest)
        run: npm test
      - name: Build
        run: npm run build
