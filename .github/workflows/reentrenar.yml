name: Reentrenar modelos
# Listo pero con el cron COMENTADO: descomenta `schedule` para activarlo (1° de cada mes, 03:00 UTC).
on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 3 1 * *'

jobs:
  reentrenar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - run: pip install -r ml/requirements.txt
      - run: python ml/entrenar.py
      - uses: actions/upload-artifact@v4
        with:
          name: modelos-${{ github.run_number }}
          path: ml/modelos/
          retention-days: 90
